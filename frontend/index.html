<!-- frontend/index.html -->
<!DOCTYPE html>
<html>
<head><title>Event Manager</title></head>
<body>
<h1>Event Manager UI</h1>
<button onclick="loadEvents()">Fetch Events</button>
<ul id="eventList"></ul>
<script>
async function loadEvents() {
const res = await fetch('http://172.18.0.6:8000/events'); // Replace with your backend service URL
const events = await res.json();
document.getElementById('eventList').innerHTML =
events.map(e => `<li>${e.title} - ${e.location}</li>`).join('');
}
</script>
</body>
</html>
